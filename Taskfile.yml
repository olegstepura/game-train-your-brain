version: '3'

# Requires: https://taskfile.dev
# Requires pnpm: https://pnpm.io/installation

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  install:
    desc: Install dependencies with pnpm
    cmds:
      - pnpm install

  dev:
    desc: Start the Vite dev server
    cmds:
      - pnpm dev

  build:
    desc: Type-check and build the production bundle
    cmds:
      - pnpm build

  preview:
    desc: Preview the production build
    deps: [build]
    cmds:
      - pnpm preview

  typecheck:
    desc: Run TypeScript in no-emit mode
    cmds:
      - pnpm typecheck

  lint:
    desc: Run ESLint
    cmds:
      - pnpm lint

  test:
    desc: Run the unit tests
    cmds:
      - pnpm test

  clean:
    desc: Remove build artefacts and dependencies
    cmds:
      - rm -rf node_modules dist
